<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>ScrapRPG</title>

    <link rel="icon" type="image/png" sizes="32x32" href="styles/favicon/favicon-32x32.png">
    <link rel="icon" type="image/x-icon" href="styles/favicon/ico.ico">

    <link href="styles/main.css" rel="stylesheet">

</head>
<body>
    <audio id="musicPlayer" type="audio/ogg" preload="auto"></audio>

    <canvas id="wggjCanvas"></canvas>

    <!-- Map Maker -->
    <div class="loadiv" style="display: none;">
        <h2><img src="./assets/textures/gameicon.png" style="width: 200px;"> Map Maker: load file</h2>
        <hr style="clear: both;">

        <div id="myFileDiv" type="file"></div>
        <input id="myFile" type="file"> <br />
        
        <button onclick="loadMap()">Load!</button><br />
        <button onclick="lmresult = 'justhide'; hideSelect();">Cancel</button>
    </div>
    <!-- Save Import -->
    <div class="loadiv2" style="display: none;">
        <h2><img src="./assets/textures/gameicon.png" style="width: 200px;"> Save Manager: load file</h2>
        <hr style="clear: both;">

        <div id="myFileDiv2" type="file"></div>
        <input id="myFile2" type="file"> <br />
        
        <button onclick="loadSaveFromFile()">Load!</button><br />
        <button onclick="lmresult = 'justhide'; hideSelect2();">Cancel</button>
    </div>

    <!-- Absolute core -->
    <script src="scripts/libs/wggj.js"></script>

    <script src="scripts/core/resources.js"></script>
    <script src="scripts/core/animator.js"></script>
    <script src="scripts/core/control.js"></script>
    <script src="scripts/core/scene.js"></script>
    <script src="scripts/core/save.js"></script>

    <!-- Content -->
    <script src="scripts/content/enemies.js"></script>
    <script src="scripts/content/items.js"></script>
    <script src="scripts/content/magic.js"></script>
    <script src="scripts/content/protagonists.js"></script>
    <script src="scripts/content/quests.js"></script>
    <script src="scripts/content/shops.js"></script>

    <!-- Content Data -->
    <script src="data/content/common_tiles.js"></script>
    <script src="data/content/enemies.js"></script>
    <script src="data/content/items.js"></script>
    <script src="data/content/magic.js"></script>
    <script src="data/content/map_enemies.js"></script>
    <script src="data/content/npcs.js"></script>
    <script src="data/content/protagonists.js"></script>
    <script src="data/content/quests.js"></script>
    <script src="data/content/resources.js"></script>
    <script src="data/content/shops.js"></script>

    <!-- Graphics -->
    <script src="scripts/graphics/particles.js"></script>
    <script src="scripts/graphics/filters.js"></script>
    <script src="scripts/graphics/blend.js"></script>
    <script src="scripts/graphics/bars.js"></script>
    <script src="scripts/scenes/mapmaker/global_makerinfo.js"></script>

    <!-- Wrap & Core Assistants -->
    <script src="scripts/audio.js"></script>
    <script src="scripts/time.js"></script>
    <script src="scripts/game.js"></script>
    <script src="scripts/core/main.js"></script>
</body>
</html>
